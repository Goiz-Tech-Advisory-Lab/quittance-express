name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: v
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V="0.0.0-dev"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install . pytest aiosmtpd pyinstaller==6.21.0
      - name: Tests
        run: python -m pytest -q
      - name: Exécutable (PyInstaller)
        run: pyinstaller packaging/quittance.spec --noconfirm --distpath dist --workpath build
      - name: Vérification de l'exécutable
        shell: pwsh
        run: |
          $env:QUITTANCE_HOME = "$env:RUNNER_TEMP\qe-smoke"
          $exe = "dist\QuittanceExpress\QuittanceExpress.exe"
          $t = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          $r = Start-Process -FilePath $exe -ArgumentList "--run-due" -Wait -PassThru
          Get-Content "$env:QUITTANCE_HOME\data\logs\quittance.log"
          if ($t.ExitCode -ne 0) { throw "autotest en échec ($($t.ExitCode))" }
          if ($r.ExitCode -ne 0) { throw "run-due a échoué ($($r.ExitCode))" }
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
      - uses: actions/upload-artifact@v4
        with:
          name: QuittanceExpress-Setup
          path: dist/QuittanceExpress-Setup-*.exe
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuittanceExpress-Setup-*.exe
          generate_release_notes: true
